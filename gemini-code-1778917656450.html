<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ The Excel-free Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-orange-50 to-stone-100 min-h-screen text-stone-800 font-sans pb-12">

    <header class="bg-[#faf8f5] shadow-md mb-8 border-b border-stone-200">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-extrabold text-stone-700 tracking-wide text-center md:text-left">
                <i class="fa-solid fa-compass animate-spin-slow text-amber-600 mr-2"></i>The Excel-free Planner
            </h1>
            <div class="space-x-2">
                <button onclick="saveItinerary()" class="bg-stone-700 hover:bg-stone-800 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-200 w-full md:w-auto">
                    <i class="fa-solid fa-share-nodes mr-2"></i>Save & Copy Link
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        
        <section class="bg-[#faf8f5] rounded-2xl p-6 shadow-sm border border-stone-200 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-semibold text-stone-500 mb-1">Destination</label>
                <input type="text" id="destination" value="Seoul 2026 🇰🇷" class="w-full text-lg md:text-xl font-bold bg-white border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-stone-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-500 mb-1">Travel Dates</label>
                <input type="text" id="travel-dates" value="May 12 - May 18" class="w-full text-lg md:text-xl font-bold bg-white border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-stone-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-500 mb-1">Active Time Window</label>
                <input type="text" id="active-time" value="09:00 - 22:00" class="w-full text-lg md:text-xl font-bold bg-white border border-stone-200 rounded-lg p-2 focus:ring-2 focus:ring-stone-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-500 mb-1">Total Budget</label>
                <div class="w-full text-lg md:text-xl font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2 flex items-center">
                    $ <span id="total-cost" class="ml-1">0</span>
                </div>
            </div>
        </section>

        <section id="itinerary-container" class="space-y-6">
            </section>

        <div class="mt-6 text-center">
            <button onclick="addDay()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition duration-200">
                <i class="fa-solid fa-calendar-plus mr-2"></i>Add Next Day
            </button>
        </div>

    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-stone-700 text-amber-50 px-6 py-3 rounded-xl shadow-lg transform translate-y-24 opacity-0 transition duration-300 pointer-events-none flex items-center z-50">
        <i class="fa-solid fa-circle-check mr-2 text-amber-400"></i> <span id="toast-msg">Plan saved & Link copied!</span>
    </div>

    <script>
        // Check URL for shared data or load local data on start
        window.onload = function() {
            if (window.location.hash && window.location.hash.startsWith('#data=')) {
                loadFromURL();
            } else if (localStorage.getItem('travelPlan')) {
                loadFromStorage();
            } else {
                // If nothing exists, create Day 1 by default
                addDay();
            }
            calculateTotal();
        }

        // Generate the HTML for a single activity row
        function getActivityHTML(time = "", desc = "", cost = "") {
            return `
                <div class="activity-item flex flex-col md:flex-row gap-3 items-start md:items-center bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                    <div class="w-full md:w-32 flex items-center gap-2">
                        <i class="fa-regular fa-clock text-stone-500"></i>
                        <input type="text" placeholder="e.g. 09:00" value="${time}" class="activity-time w-full bg-[#faf8f5] border border-stone-300 rounded px-2 py-1 text-sm font-medium focus:outline-none focus:ring-1 focus:ring-amber-400">
                    </div>
                    <div class="w-full flex-1">
                        <input type="text" placeholder="What are we doing? (e.g. Gyeongbokgung Palace)" value="${desc}" class="activity-desc w-full bg-[#faf8f5] border border-stone-300 rounded px-3 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-amber-400">
                    </div>
                    <div class="w-full md:w-28 flex items-center gap-2">
                        <i class="fa-solid fa-dollar-sign text-amber-600"></i>
                        <input type="number" placeholder="Cost" value="${cost}" class="activity-cost w-full bg-[#faf8f5] border border-stone-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-amber-400" oninput="calculateTotal()">
                    </div>
                    <div class="flex w-full md:w-auto gap-2 justify-end mt-2 md:mt-0">
                        <button onclick="openMap(this)" title="Search on Google Maps" class="text-stone-500 hover:text-amber-700 bg-stone-100 hover:bg-amber-100 px-3 py-1 rounded transition border border-stone-200">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </button>
                        <button onclick="this.closest('.activity-item').remove(); calculateTotal();" title="Delete Activity" class="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition border border-red-100">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function addActivity(button) {
            const activitiesList = button.closest('.day-card').querySelector('.activities-list');
            activitiesList.insertAdjacentHTML('beforeend', getActivityHTML());
        }

        function addDay(dayName = null) {
            const container = document.getElementById('itinerary-container');
            const dayCount = container.querySelectorAll('.day-card').length + 1;
            const finalDayName = dayName || `Day ${dayCount}`;
            
            const dayCard = document.createElement('div');
            dayCard.className = "day-card bg-[#faf8f5] rounded-2xl shadow-sm border border-stone-200 overflow-hidden";
            dayCard.innerHTML = `
                <div class="bg-stone-100 px-6 py-4 border-b border-stone-200 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-stone-700 flex items-center">
                        <i class="fa-solid fa-calendar-day mr-2 text-amber-600"></i>
                        <input type="text" value="${finalDayName}" class="day-title bg-transparent border-none focus:ring-0 text-lg font-bold text-stone-700 outline-none w-32 focus:bg-white focus:rounded px-1">
                    </h3>
                    <button onclick="addActivity(this)" class="text-sm bg-amber-600 hover:bg-amber-700 text-white font-medium py-1.5 px-4 rounded-md transition">
                        <i class="fa-solid fa-plus mr-1"></i> Add
                    </button>
                </div>
                <div class="activities-list p-4 space-y-3">
                    ${dayName ? '' : getActivityHTML()} </div>
            `;
            container.appendChild(dayCard);
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.activity-cost').forEach(input => {
                let cost = parseFloat(input.value);
                if (!isNaN(cost)) {
                    total += cost;
                }
            });
            document.getElementById('total-cost').innerText = total.toLocaleString();
        }

        function openMap(button) {
            const descInput = button.closest('.activity-item').querySelector('.activity-desc').value;
            if(descInput.trim() === '') {
                alert("Please enter a location or activity description first.");
                return;
            }
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(descInput)}`;
            window.open(mapUrl, '_blank');
        }

        function saveItinerary() {
            const planData = {
                destination: document.getElementById('destination').value,
                dates: document.getElementById('travel-dates').value,
                activeTime: document.getElementById('active-time').value,
                days: []
            };

            document.querySelectorAll('.day-card').forEach(dayCard => {
                const dayName = dayCard.querySelector('.day-title').value;
                const activities = [];
                
                dayCard.querySelectorAll('.activity-item').forEach(item => {
                    activities.push({
                        time: item.querySelector('.activity-time').value,
                        desc: item.querySelector('.activity-desc').value,
                        cost: item.querySelector('.activity-cost').value
                    });
                });

                planData.days.push({ dayName, activities });
            });

            // 1. Save locally just in case
            localStorage.setItem('travelPlan', JSON.stringify(planData));
            
            // 2. Encode to URL for sharing (handling unicode safely)
            const jsonString = JSON.stringify(planData);
            const encodedData = btoa(encodeURIComponent(jsonString));
            
            // Update the URL without reloading the page
            const shareableLink = window.location.origin + window.location.pathname + "#data=" + encodedData;
            window.history.replaceState(null, null, shareableLink);

            // Copy to clipboard
            navigator.clipboard.writeText(shareableLink).then(() => {
                showToast("Plan saved & Link copied to clipboard! Share it with friends.");
            }).catch(err => {
                showToast("Plan saved! Copy the URL in your browser to share.");
            });
        }

        function loadDataToUI(data) {
            document.getElementById('destination').value = data.destination || '';
            document.getElementById('travel-dates').value = data.dates || '';
            document.getElementById('active-time').value = data.activeTime || '';

            const container = document.getElementById('itinerary-container');
            container.innerHTML = ''; 

            data.days.forEach(day => {
                addDay(day.dayName);
                // Get the last added day card
                const dayCards = document.querySelectorAll('.day-card');
                const currentDayCard = dayCards[dayCards.length - 1];
                const activitiesList = currentDayCard.querySelector('.activities-list');
                
                day.activities.forEach(act => {
                    activitiesList.insertAdjacentHTML('beforeend', getActivityHTML(act.time, act.desc, act.cost));
                });
            });
            calculateTotal();
        }

        function loadFromStorage() {
            try {
                const data = JSON.parse(localStorage.getItem('travelPlan'));
                if(data) loadDataToUI(data);
            } catch(e) { console.error("Error loading local storage"); }
        }

        function loadFromURL() {
            try {
                const hashData = window.location.hash.substring(6); // remove '#data='
                const jsonString = decodeURIComponent(atob(hashData));
                const data = JSON.parse(jsonString);
                loadDataToUI(data);
                showToast("Shared plan loaded successfully!");
            } catch(e) {
                console.error("Error parsing URL data", e);
                alert("This shared link seems broken or expired.");
                loadFromStorage(); // fallback
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
        }
    </script>
</body>
</html>
