<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ The Excel-free Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#E5D7C5',
                            dark: '#c1ad94',
                            text: '#5c4a38',
                            bg: '#fcfbfa'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg min-h-screen text-brand-text font-sans pb-16">

    <header class="bg-white shadow-sm mb-6 border-b-2 border-brand">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
                <h1 class="text-3xl font-extrabold text-brand-text tracking-wide text-center md:text-left flex items-center">
                    <i class="fa-solid fa-route animate-pulse text-brand-dark mr-3"></i>The Excel-free Planner
                </h1>
                <div class="space-x-2 w-full md:w-auto">
                    <button onclick="saveItinerary()" class="bg-brand hover:bg-brand-dark text-brand-text font-bold py-2 px-6 rounded-lg shadow-sm transition duration-200 w-full md:w-auto flex justify-center items-center">
                        <i class="fa-solid fa-share-nodes mr-2"></i>Save & Copy Link
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3 justify-center md:justify-start border-t border-brand/30 pt-3">
                <a href="#summary-section" class="bg-brand-bg border border-brand text-brand-text hover:bg-brand px-4 py-1.5 rounded-full text-sm font-bold transition flex items-center">
                    <i class="fa-solid fa-calculator mr-2"></i> Daily Spend
                </a>
                <a href="#notes-section" class="bg-brand-bg border border-brand text-brand-text hover:bg-brand px-4 py-1.5 rounded-full text-sm font-bold transition flex items-center">
                    <i class="fa-solid fa-clipboard mr-2"></i> Notes
                </a>
                <a href="#checklist-section" class="bg-brand-bg border border-brand text-brand-text hover:bg-brand px-4 py-1.5 rounded-full text-sm font-bold transition flex items-center">
                    <i class="fa-solid fa-list-check mr-2"></i> Checklist
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">
        
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-brand/50 mb-8 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4">
            <div class="lg:col-span-1">
                <label class="block text-xs font-bold text-brand-dark uppercase tracking-wide mb-1">Destination</label>
                <input type="text" id="destination" value="Seoul 2026 🇰🇷" class="w-full text-lg font-bold bg-brand-bg border border-brand/50 rounded-lg p-2 focus:ring-2 focus:ring-brand outline-none transition">
            </div>
            <div class="lg:col-span-1">
                <label class="block text-xs font-bold text-brand-dark uppercase tracking-wide mb-1">Travel Dates</label>
                <input type="text" id="travel-dates" value="May 12 - May 18" class="w-full text-lg font-bold bg-brand-bg border border-brand/50 rounded-lg p-2 focus:ring-2 focus:ring-brand outline-none transition">
            </div>
            <div class="lg:col-span-1">
                <label class="block text-xs font-bold text-brand-dark uppercase tracking-wide mb-1">Hotel</label>
                <div class="flex bg-brand-bg border border-brand/50 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-brand transition">
                    <input type="text" id="hotel" value="Lotte Hotel" class="w-full text-lg font-bold bg-transparent p-2 outline-none">
