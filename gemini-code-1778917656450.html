<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Our Epic Travel Planner</title>
    <!-- Tailwind CSS for a good looking interface -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen text-gray-800 font-sans pb-12">

    <!-- Header Section -->
    <header class="bg-white shadow-md mb-8">
        <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-indigo-600 tracking-wide">
                <i class="fa-solid fa-compass animate-spin-slow text-teal-500 mr-2"></i>Wanderlust Planner
            </h1>
            <div class="space-x-2">
                <button onclick="saveItinerary()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-200">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>Save Plan
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4">
        
        <!-- Travel Metadata -->
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-500 mb-1">Destination</label>
                <input type="text" id="destination" value="Japan 2026 🌸" class="w-full text-xl font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-500 mb-1">Travel Dates</label>
                <input type="text" id="travel-dates" value="Oct 12 - Oct 18" class="w-full text-xl font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-500 mb-1">Active Time Window</label>
                <input type="text" id="active-time" value="09:00 - 22:00" class="w-full text-xl font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-400 outline-none">
            </div>
        </section>

        <!-- Itinerary Days -->
        <section id="itinerary-container" class="space-y-6">
            <!-- Days will be generated by JavaScript, but here is Day 1 as default template -->
            <div class="day-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-indigo-50 px-6 py-4 border-b border-indigo-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-indigo-800 flex items-center">
                        <i class="fa-solid fa-calendar-day mr-2 text-indigo-500"></i>
                        <span class="day-title">Day 1</span>
                    </h3>
                    <button onclick="addActivity(this)" class="text-sm bg-teal-500 hover:bg-teal-600 text-white font-medium py-1.5 px-4 rounded-md transition">
                        <i class="fa-solid fa-plus mr-1"></i> Add Activity
                    </button>
                </div>
                
                <!-- Activities List -->
                <div class="activities-list p-6 space-y-4">
                    <!-- Activity Row Template -->
                    <div class="activity-item flex flex-col md:flex-row gap-4 items-start md:items-center bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div class="w-full md:w-32 flex items-center gap-2">
                            <i class="fa-regular fa-clock text-indigo-500"></i>
                            <input type="text" placeholder="09:00" class="activity-time w-full bg-white border border-gray-300 rounded px-2 py-1 text-sm font-medium">
                        </div>
                        <div class="flex-1 w-full">
                            <input type="text" placeholder="What are we doing? (e.g., Breakfast at Tsukiji Market)" class="activity-desc w-full bg-white border border-gray-300 rounded px-3 py-1 text-sm">
                        </div>
                        <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 self-end md:self-auto">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Add Day Button -->
        <div class="mt-6 text-center">
            <button onclick="addDay()" class="bg-teal-500 hover:bg-teal-600 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition duration-200">
                <i class="fa-solid fa-calendar-plus mr-2"></i>Add Next Day
            </button>
        </div>

    </main>

    <!-- Simple Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition duration-300 pointer-events-none flex items-center">
        <i class="fa-solid fa-circle-check mr-2"></i> Plan saved successfully! (In this browser)
    </div>

    <!-- Logic Script -->
    <script>
        // Load saved data on start
        window.onload = function() {
            if(localStorage.getItem('travelPlan')) {
                loadItinerary();
            }
        }

        function addActivity(button) {
            const activitiesList = button.closest('.day-card').querySelector('.activities-list');
            const row = document.createElement('div');
            row.className = "activity-item flex flex-col md:flex-row gap-4 items-start md:items-center bg-gray-50 p-4 rounded-xl border border-gray-200";
            row.innerHTML = `
                <div class="w-full md:w-32 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-indigo-500"></i>
                    <input type="text" placeholder="12:00" class="activity-time w-full bg-white border border-gray-300 rounded px-2 py-1 text-sm font-medium">
                </div>
                <div class="flex-1 w-full">
                    <input type="text" placeholder="Next stop..." class="activity-desc w-full bg-white border border-gray-300 rounded px-3 py-1 text-sm">
                </div>
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 self-end md:self-auto">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            activitiesList.appendChild(row);
        }

        function addDay() {
            const container = document.getElementById('itinerary-container');
            const dayCount = container.querySelectorAll('.day-card').length + 1;
            
            const dayCard = document.createElement('div');
            dayCard.className = "day-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden";
            dayCard.innerHTML = `
                <div class="bg-indigo-50 px-6 py-4 border-b border-indigo-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-indigo-800 flex items-center">
                        <i class="fa-solid fa-calendar-day mr-2 text-indigo-500"></i>
                        <span class="day-title">Day ${dayCount}</span>
                    </h3>
                    <button onclick="addActivity(this)" class="text-sm bg-teal-500 hover:bg-teal-600 text-white font-medium py-1.5 px-4 rounded-md transition">
                        <i class="fa-solid fa-plus mr-1"></i> Add Activity
                    </button>
                </div>
                <div class="activities-list p-6 space-y-4"></div>
            `;
            container.appendChild(dayCard);
        }

        function saveItinerary() {
            const planData = {
                destination: document.getElementById('destination').value,
                dates: document.getElementById('travel-dates').value,
                activeTime: document.getElementById('active-time').value,
                days: []
            };

            document.querySelectorAll('.day-card').forEach(dayCard => {
                const dayName = dayCard.querySelector('.day-title').innerText;
                const activities = [];
                
                dayCard.querySelectorAll('.activity-item').forEach(item => {
                    activities.push({
                        time: item.querySelector('.activity-time').value,
                        desc: item.querySelector('.activity-desc').value
                    });
                });

                planData.days.push({ dayName, activities });
            });

            localStorage.setItem('travelPlan', JSON.stringify(planData));
            
            // Show toast notification
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function loadItinerary() {
            const data = JSON.parse(localStorage.getItem('travelPlan'));
            document.getElementById('destination').value = data.destination;
            document.getElementById('travel-dates').value = data.dates;
            document.getElementById('active-time').value = data.activeTime;

            const container = document.getElementById('itinerary-container');
            container.innerHTML = ''; // Clear default template

            data.days.forEach(day => {
                const dayCard = document.createElement('div');
                dayCard.className = "day-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden";
                
                let activitiesHTML = '';
                day.activities.forEach(act => {
                    activitiesHTML += `
                        <div class="activity-item flex flex-col md:flex-row gap-4 items-start md:items-center bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <div class="w-full md:w-32 flex items-center gap-2">
                                <i class="fa-regular fa-clock text-indigo-500"></i>
                                <input type="text" value="${act.time}" class="activity-time w-full bg-white border border-gray-300 rounded px-2 py-1 text-sm font-medium">
                            </div>
                            <div class="flex-1 w-full">
                                <input type="text" value="${act.desc}" class="activity-desc w-full bg-white border border-gray-300 rounded px-3 py-1 text-sm">
                            </div>
                            <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 self-end md:self-auto">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                });

                dayCard.innerHTML = `
                    <div class="bg-indigo-50 px-6 py-4 border-b border-indigo-100 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-indigo-800 flex items-center">
                            <i class="fa-solid fa-calendar-day mr-2 text-indigo-500"></i>
                            <span class="day-title">${day.dayName}</span>
                        </h3>
                        <button onclick="addActivity(this)" class="text-sm bg-teal-500 hover:bg-teal-600 text-white font-medium py-1.5 px-4 rounded-md transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add Activity
                        </button>
                    </div>
                    <div class="activities-list p-6 space-y-4">${activitiesHTML}</div>
                `;
                container.appendChild(dayCard);
            });
        }
    </script>
</body>
</html>
